[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-calc"
version = "0.1.0"
description = "What a Copilot CLI project actually cost - measured, not estimated."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Ethical Tech CoLab" }]
keywords = ["copilot", "usage", "telemetry", "cost", "dashboard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies, deliberately. The package is standard library only so
# it can run on a machine that was never set up for this work - which is exactly
# the machine whose usage is hardest to collect.
dependencies = []

[project.urls]
Homepage = "https://github.com/Ethical-Tech-CoLab/usage-calc"
Issues = "https://github.com/Ethical-Tech-CoLab/usage-calc/issues"

[project.scripts]
usage-calc = "usagecalc.cli:main"

[tool.setuptools]
packages = ["usagecalc"]

[tool.setuptools.package-data]
usagecalc = ["templates/*.html"]
